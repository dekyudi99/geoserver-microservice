services:
  geoserver:
    image: kartoza/geoserver:2.28.2
    container_name: geoserver_ikya
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ./proyek-gis/data_raster:/data_raster
      - ./proyek-gis/data_vector:/data_vector
    networks:
      gis_network:
        aliases:
          - geoserver
          - geoserver_ikya

  geoserver-microservice:
    build: .
    container_name: geoserver-microservice
    restart: unless-stopped
    ports:
      - "8005:8001"
    env_file:
      - .env
    volumes:
      - ./proyek-gis/data_raster:/data_raster
      - ./proyek-gis/data_vector:/data_vector
    depends_on:
      - geoserver
    networks:
      - gis_network

networks:
  gis_network:
    name: network_gis
    external: true
